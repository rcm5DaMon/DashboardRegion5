<script>
  const GOOGLE_SHEET_ID = "1TcVbH-ccKUS1AC-oHEIqCAj4IAyS2DmQgywFMqD85HQ";
  const GOOGLE_SHEET_NAME = "Users";
  const LOGIN_FORM_ID = "1FAIpQLSc8a96-q6g-pNqEXIBmLK7qrxHe5OSKCRkS3w8GHlqs1flTPQ";
  const LOGIN_EMAIL_ENTRY_ID = "entry.804019142";
  const LOGIN_FORM_URL = "https://docs.google.com/forms/d/e/" + LOGIN_FORM_ID + "/formResponse";

  const POWER_BI_BASE_URL = "https://app.powerbi.com/view?r=eyJrIjoiNWQxMjI1NmYtYTUyMi00ZGVhLWFlNDItMDk2MjNhNGE5NDVmIiwidCI6IjU3OGRiYWRkLWMzMmMtNGY1YS04YzQ0LTMzZGE0NGM3MTIwOSIsImMiOjEwfQ%3D%3D";
  const POWER_BI_BASE_URL2 = "https://app.powerbi.com/view?r=eyJrIjoiYzg2M2EzYjQtNjA4NS00NTU3LTg5MjktZWMyODg4MGZhYTQ3IiwidCI6IjU3OGRiYWRkLWMzMmMtNGY1YS04YzQ0LTMzZGE0NGM3MTIwOSIsImMiOjEwfQ%3D%3D";

  const REPORT_PAGES = [
    { name: "Sales Performance", sectionId: "bb254124c2e3ea4468dd", baseUrl: POWER_BI_BASE_URL },
    { name: "Stock Devices", sectionId: "4257b26ca018b5b2da22", baseUrl: POWER_BI_BASE_URL },
    { name: "Stock Accessories", sectionId: "f859f15a2c4020eb0103", baseUrl: POWER_BI_BASE_URL },
    { name: "Stock Laptop", sectionId: "7c7a87475b7e273d59e6", baseUrl: POWER_BI_BASE_URL },
    { name: "Stock CE", sectionId: "1b6d3f7dc80e90d77b8c", baseUrl: POWER_BI_BASE_URL },
    { name: "Stock Aging", sectionId: "90c5af6e23ed063bc92c", baseUrl: POWER_BI_BASE_URL },
    { name: "Festival Belanja Erafone", sectionId: "f9d2fcc9ec3193ff8959", baseUrl: POWER_BI_BASE_URL2 }
  ];

  let isLoggedIn = false;

  const loginView = document.getElementById("login-view");
  const dashboardView = document.getElementById("dashboard-view");
  const loginForm = document.getElementById("login-form");
  const emailInput = document.getElementById("email-input");
  const loginButton = document.getElementById("login-button");
  const logoutButton = document.getElementById("logout-button");
  const errorMessage = document.getElementById("error-message");
  const welcomeMessage = document.getElementById("welcome-message");
  const powerBIFrame = document.getElementById("powerbi-frame");
  const pageSelect = document.getElementById("page-select");

  function initPageMenu() {
    pageSelect.innerHTML = "";

    REPORT_PAGES.forEach((page) => {
      const option = document.createElement("option");
      const base = page.baseUrl || POWER_BI_BASE_URL;
      option.value = page.sectionId
        ? base + "&pageName=" + encodeURIComponent(page.sectionId)
        : base;
      option.textContent = page.name;
      pageSelect.appendChild(option);
    });
  }

  initPageMenu();

  function getUsersFromGoogleSheet() {
    return new Promise((resolve, reject) => {
      const callbackName = "googleSheetCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
      const script = document.createElement("script");
      const query = "select A, B where A is not null";

      const requestTimeout = setTimeout(() => {
        cleanup();
        reject(new Error("The Google Sheet request timed out."));
      }, 15000);

      function cleanup() {
        clearTimeout(requestTimeout);
        if (script.parentNode) script.parentNode.removeChild(script);
        try {
          delete window[callbackName];
        } catch (error) {
          window[callbackName] = undefined;
        }
      }

      window[callbackName] = function (response) {
        try {
          if (!response) throw new Error("Google Sheets returned an empty response.");

          if (response.status === "error") {
            const details =
              response.errors?.[0]?.detailed_message ||
              response.errors?.[0]?.message ||
              "Unknown Google Sheets error.";
            throw new Error(details);
          }

          const rows = response.table?.rows || [];
          const users = rows
            .map((row) => ({
              email: row.c?.[0]?.v ? String(row.c[0].v).trim().toLowerCase() : "",
              userName: row.c?.[1]?.v ? String(row.c[1].v).trim() : "User"
            }))
            .filter((user) => user.email !== "");

          cleanup();
          resolve(users);
        } catch (error) {
          cleanup();
          reject(error);
        }
      };

      script.onerror = function () {
        cleanup();
        reject(new Error("Unable to load the Google Sheet."));
      };

      const sheetURL =
        "https://docs.google.com/spreadsheets/d/" +
        encodeURIComponent(GOOGLE_SHEET_ID) +
        "/gviz/tq" +
        "?sheet=" + encodeURIComponent(GOOGLE_SHEET_NAME) +
        "&headers=1" +
        "&tq=" + encodeURIComponent(query) +
        "&tqx=" + encodeURIComponent("out:json;responseHandler:" + callbackName) +
        "&cacheBust=" + Date.now();

      script.src = sheetURL;
      script.async = true;
      document.body.appendChild(script);
    });
  }

  function recordLogin(email) {
    try {
      const formData = new URLSearchParams();
      formData.append(LOGIN_EMAIL_ENTRY_ID, email);

      fetch(LOGIN_FORM_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData.toString(),
        keepalive: true
      }).catch((error) => console.error("Unable to record login:", error));
    } catch (e) {
      console.warn("Analytics recording skipped:", e);
    }
  }

  async function handleLogin(event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }
    hideError();

    const inputEmail = emailInput.value.trim().toLowerCase();

    if (!inputEmail) {
      showError("Please enter your email address.");
      emailInput.focus();
      return false;
    }

    setLoginLoading(true);

    try {
      const users = await getUsersFromGoogleSheet();
      const foundUser = users.find((user) => user.email === inputEmail);

      if (!foundUser) {
        showError("Access denied. This email address is not registered.");
        setLoginLoading(false);
        return false;
      }

      recordLogin(foundUser.email);
      openDashboard(foundUser);
    } catch (error) {
      console.error("Login verification error:", error);
      showError("Unable to verify email. Check sheet connection or permissions.");
      setLoginLoading(false);
    }

    return false;
  }

  function openDashboard(user) {
    try {
      isLoggedIn = true;
      welcomeMessage.textContent = "Welcome, " + (user.userName || "User");

      loginView.style.display = "none";
      dashboardView.style.display = "flex";

      if (pageSelect && pageSelect.options.length > 0) {
        powerBIFrame.src = pageSelect.value;
      }
    } catch (err) {
      console.error("Dashboard opening error:", err);
    } finally {
      setLoginLoading(false);
    }
  }

  function handlePageChange(event) {
    if (event.target.value) {
      powerBIFrame.src = event.target.value;
    }
  }

  function setLoginLoading(isLoading) {
    loginButton.disabled = isLoading;
    emailInput.disabled = isLoading;
    loginButton.querySelector("span").textContent = isLoading ? "Verifying..." : "Sign in";
  }

  function showError(message) {
    errorMessage.textContent = message;
    errorMessage.style.display = "block";
  }

  function hideError() {
    errorMessage.textContent = "";
    errorMessage.style.display = "none";
  }

  function logout() {
    isLoggedIn = false;
    powerBIFrame.src = "";
    welcomeMessage.textContent = "System active";
    dashboardView.style.display = "none";
    loginView.style.display = "grid";
    emailInput.value = "";
    emailInput.disabled = false;

    if (pageSelect.options.length > 0) pageSelect.selectedIndex = 0;

    hideError();
    emailInput.focus();
  }

  loginForm.addEventListener("submit", handleLogin);
  logoutButton.addEventListener("click", logout);
  pageSelect.addEventListener("change", handlePageChange);
</script>
